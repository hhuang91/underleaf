# Builds and tests the double-clickable apps for Windows and macOS.
#
# - Every push to main and every pull request: build, test, and attach the
#   apps to the workflow run (Actions tab > run > Artifacts).
# - Pushing a tag such as v0.1.0 additionally publishes them as a GitHub Release.
#
# macOS code signing is optional. Without the secrets below the app is ad-hoc
# signed, which runs fine but shows Gatekeeper's "unidentified developer"
# prompt on first launch (see README). To ship signed and notarized builds add:
#   CSC_LINK, CSC_KEY_PASSWORD                      Developer ID certificate (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarization

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            app: dist/win-unpacked/Underleaf.exe
          - name: macOS
            os: macos-latest
            script: dist:mac
            app: dist/mac-arm64/Underleaf.app/Contents/MacOS/Underleaf

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Separate steps: in a multi-line script PowerShell carries on after a
      # command that failed, and only the last one decides the outcome.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npm run ${{ matrix.script }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run ${{ matrix.script }}
          else
            # No Developer ID certificate: sign ad hoc so the app still starts
            # on Apple silicon, where unsigned code is not allowed to run.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # electron-builder skips signing in pull-request builds unless told
            # otherwise. Ad-hoc signing involves no secrets, so it is safe there.
            export CSC_FOR_PULL_REQUEST=true
            npm run ${{ matrix.script }} -- -c.mac.identity=- -c.mac.notarize=false
          fi

      # Uploaded before the end-to-end tests, so that a build is there to look
      # at when one of them fails.
      - uses: actions/upload-artifact@v7
        with:
          name: Underleaf-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      # The tests below drive the packaged app the way a user would. The hosted
      # Windows machines start with a 1024x768 screen, smaller than the window.
      - name: Use a larger screen
        if: runner.os == 'Windows'
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: End-to-end test of the packaged app
        run: npm run test:e2e
        env:
          UNDERLEAF_E2E_APP: ${{ matrix.app }}
          UNDERLEAF_E2E_RUN: test-engine

      # The same walk-through with the engine that ships inside the app, which
      # downloads TeX packages on its first run. Not for pull requests, so that
      # they do not depend on the package server being reachable.
      - name: End-to-end test with the built-in TeX engine
        if: github.event_name != 'pull_request'
        run: npm run test:e2e
        env:
          UNDERLEAF_E2E_APP: ${{ matrix.app }}
          UNDERLEAF_E2E_REAL_ENGINE: '1'
          UNDERLEAF_E2E_RUN: built-in-engine

      # The installer itself: install it the way a double-click does, minus
      # the windows, and walk through the copy it installed.
      - name: Install with the Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No installer was built.' }
          # /S installs without showing anything and without starting the app.
          $process = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru
          $null = $process.Handle # without this the exit code is lost
          if (-not $process.WaitForExit(240000)) {
            $process.Kill()
            throw 'The installer did not finish within four minutes.'
          }
          if ($process.ExitCode -ne 0) { throw "The installer ended with exit code $($process.ExitCode)." }
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Underleaf.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $app) { throw 'The installer did not install Underleaf.exe.' }
          "Installed to $($app.FullName)"
          "UNDERLEAF_INSTALLED_APP=$($app.FullName)" >> $env:GITHUB_ENV

      - name: End-to-end test of the installed app
        if: runner.os == 'Windows'
        run: npm run test:e2e
        env:
          UNDERLEAF_E2E_APP: ${{ env.UNDERLEAF_INSTALLED_APP }}
          UNDERLEAF_E2E_RUN: installed

      - name: Keep the screenshots of the end-to-end tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ matrix.name }}
          path: tests/e2e/output
          if-no-files-found: ignore

  # The writing assistant with real model servers: llama.cpp's server and
  # Ollama, each with a small model. Both are downloaded at a fixed version and
  # checked against their published checksums; the models come from Hugging
  # Face and Ollama's registry. The answers of a model cannot be predicted, so
  # the tests check that they arrive in the expected form, and print them.
  model-servers:
    name: Model servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLAMA_BUILD: b12359 # llama.cpp v1.0.0
      LLAMA_SHA256: 0bc1f091e8916102b6d8f2cf944233a620e90a0f856c72d0ce41150c65c2e72e
      OLLAMA_VERSION: v0.40.17
      OLLAMA_SHA256: 1df9d6228bac5a22e420b242708c0d10e5b886db97bab99d446a41760f4e79af
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start llama.cpp's server with a small model
        run: |
          curl -fsSL --retry 3 -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_BUILD/llama-$LLAMA_BUILD-bin-ubuntu-x64.tar.gz"
          echo "$LLAMA_SHA256  llama.tar.gz" | sha256sum -c -
          mkdir llama && tar -xzf llama.tar.gz -C llama
          server=$(find llama -name llama-server -type f | head -n 1)
          LD_LIBRARY_PATH="$(dirname "$server")" nohup "$server" -hf Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M \
            --alias qwen2.5-0.5b-instruct --host 127.0.0.1 --port 8080 -c 4096 > llama-server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then echo "Ready after about $((i * 5)) s"; exit 0; fi
            sleep 5
          done
          cat llama-server.log
          exit 1

      - name: Start Ollama with a small model
        run: |
          command -v zstd > /dev/null || (sudo apt-get update && sudo apt-get install -y zstd)
          curl -fsSL --retry 3 -o ollama.tar.zst "https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          echo "$OLLAMA_SHA256  ollama.tar.zst" | sha256sum -c -
          mkdir ollama && tar --zstd -xf ollama.tar.zst -C ollama
          ollama=$(find ollama -path '*/bin/ollama' -type f | head -n 1)
          nohup "$ollama" serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version > /dev/null && break; sleep 2; done
          "$ollama" pull qwen2.5:0.5b

      - name: The writing assistant with the real servers
        run: npx vitest run tests/unit/assistant.test.ts --silent=false --disable-console-intercept
        env:
          UNDERLEAF_TEST_LLM: llama.cpp|http://127.0.0.1:8080/v1|qwen2.5-0.5b-instruct;Ollama|http://127.0.0.1:11434/v1|qwen2.5:0.5b

      - name: What the servers logged
        if: failure()
        run: tail -n 80 llama-server.log ollama.log

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Underleaf-*
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
